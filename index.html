<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cash and Ridges Games</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', sans-serif;
  background:
    radial-gradient(circle at top left, #2b1055, transparent 40%),
    radial-gradient(circle at bottom right, #ff6a00, transparent 40%),
    linear-gradient(135deg, #0a0a12, #111827, #1f1f3a);
  margin: 0;
  display: flex;
  justify-content: center;
  color: #fff;
  overflow-x: hidden;
  min-height: 100vh;
}

/* Animated Background Glow */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: linear-gradient(
    45deg,
    red,
    orange,
    yellow,
    lime,
    cyan,
    blue,
    violet,
    red
  );
  background-size: 600% 600%;
  opacity: 0.08;
  animation: bgFlow 18s linear infinite;
  pointer-events: none;
  z-index: -1;
}

@keyframes bgFlow {
  0% { background-position: 0% 50%; }
  100% { background-position: 400% 50%; }
}

.container {
  width: 90%;
  max-width: 1200px;
  text-align: center;
  padding: 30px;
}

h1 {
  font-size: 58px;
  text-transform: uppercase;
  font-weight: 900;
  letter-spacing: 3px;
  background: linear-gradient(
    90deg,
    red,
    orange,
    yellow,
    lime,
    cyan,
    blue,
    violet,
    red
  );
  background-size: 400%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: rainbowShift 6s linear infinite;
  text-shadow: 0 0 25px rgba(255,255,255,0.15);
  margin-bottom: 10px;
}

@keyframes rainbowShift {
  0% { background-position: 0%; }
  100% { background-position: 400%; }
}

.subtitle {
  opacity: 0.8;
  margin-bottom: 30px;
  font-size: 18px;
}

#game-list {
  list-style: none;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 22px;
  margin-top: 30px;
}

#game-list li {
  position: relative;
  overflow: hidden;
  background: rgba(255,255,255,0.07);
  backdrop-filter: blur(14px);
  padding: 20px;
  border-radius: 18px;
  cursor: pointer;
  transition: all 0.28s ease;
  border: 1px solid rgba(255,255,255,0.12);
  font-weight: bold;
  font-size: 18px;
}

/* Neon border animation */
#game-list li::before {
  content: "";
  position: absolute;
  inset: -2px;
  background: linear-gradient(
    45deg,
    red,
    orange,
    yellow,
    lime,
    cyan,
    blue,
    violet,
    red
  );
  background-size: 400%;
  border-radius: 20px;
  z-index: -1;
  opacity: 0;
  transition: 0.3s;
  animation: rainbowShift 5s linear infinite;
}

#game-list li:hover::before {
  opacity: 1;
}

#game-list li:hover {
  transform: translateY(-8px) scale(1.05);
  box-shadow:
    0 0 20px rgba(255, 106, 0, 0.4),
    0 0 40px rgba(0, 255, 255, 0.25),
    0 0 60px rgba(255, 0, 255, 0.2);
}

.rainbow-text {
  background: linear-gradient(
    90deg,
    red,
    orange,
    yellow,
    lime,
    cyan,
    blue,
    violet,
    red
  );
  background-size: 300%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: rainbowShift 3s linear infinite;
}

/* SPECIAL ELITE CARD */
.elite-card {
  background: rgba(255,255,255,0.12) !important;
  border: 2px solid rgba(255,255,255,0.2);
  box-shadow:
    0 0 20px rgba(255,0,255,0.4),
    0 0 40px rgba(0,255,255,0.25),
    inset 0 0 20px rgba(255,255,255,0.05);
  animation: pulseGlow 3s ease-in-out infinite;
}

.elite-card::before {
  opacity: 1 !important;
}

@keyframes pulseGlow {
  0% {
    transform: scale(1);
    box-shadow:
      0 0 20px rgba(255,0,255,0.4),
      0 0 40px rgba(0,255,255,0.2);
  }

  50% {
    transform: scale(1.03);
    box-shadow:
      0 0 30px rgba(255,255,0,0.5),
      0 0 60px rgba(0,255,255,0.35);
  }

  100% {
    transform: scale(1);
    box-shadow:
      0 0 20px rgba(255,0,255,0.4),
      0 0 40px rgba(0,255,255,0.2);
  }
}

#iframe-container {
  width: 100%;
  height: 650px;
  margin-top: 35px;
  position: relative;
  border-radius: 20px;
  overflow: hidden;
  border: 2px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  box-shadow:
    0 0 25px rgba(0,0,0,0.6),
    0 0 50px rgba(0,255,255,0.08);
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
  background: #000;
}

#fullscreen-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 5;
  background: linear-gradient(135deg, #ff6a00, #ff00cc);
  border: none;
  padding: 12px 18px;
  color: white;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.25s;
  box-shadow: 0 0 15px rgba(255,0,204,0.5);
}

#fullscreen-btn:hover {
  transform: scale(1.12);
  box-shadow:
    0 0 25px rgba(255,0,204,0.7),
    0 0 40px rgba(0,255,255,0.5);
}

/* Floating particles */
.particle {
  position: fixed;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: white;
  opacity: 0.2;
  animation: floatUp linear infinite;
  z-index: -1;
}

@keyframes floatUp {
  from {
    transform: translateY(100vh);
  }
  to {
    transform: translateY(-120vh);
  }
}

@media (max-width: 768px) {
  h1 {
    font-size: 40px;
  }

  #iframe-container {
    height: 500px;
  }
}
</style>
</head>

<body>

<!-- Floating Particles -->
<script>
for (let i = 0; i < 40; i++) {
  const p = document.createElement("div");
  p.className = "particle";
  p.style.left = Math.random() * 100 + "vw";
  p.style.animationDuration = (8 + Math.random() * 12) + "s";
  p.style.opacity = Math.random() * 0.4;
  p.style.width = p.style.height = (3 + Math.random() * 8) + "px";
  document.body.appendChild(p);
}
</script>

<div class="container">

  <h1>Cash and Ridges Games</h1>
  <div class="subtitle">
    Elite rainbow arcade hub 🌈🔥
  </div>

  <ul id="game-list"></ul>

  <div id="iframe-container">
    <button id="fullscreen-btn">Fullscreen</button>
    <iframe id="game-iframe"></iframe>
  </div>

</div>

<script>
const gameList = [
  { name: "Lebron", url: "https://lebro.github.io/yeahno/" },

  { 
    name: "Codys Shack Unblocked",
    url: "https://lebro.github.io/codys-shack-games/",
    rainbow: true
  },

  { 
    name: "Cheesy Dih 🧀",
    url: "https://mathley.wasmer.app/",
    rainbow: true
  },

  /* NEW ELITE WEBSITE */
  {
    name: "Cheesy Dih 2 🌈",
    url: "https://19hninc53jo6.id.wasmer.app/",
    rainbow: true,
    elite: true
  },

  { 
    name: "Website 1",
    url: "https://scienceclassess.github.io/mathclassisnotgoodandsciencetooig/"
  },

  { 
    name: "Website 2",
    url: "https://scienceclassess.github.io/scienceclassesstuah/"
  },

  { 
    name: "Website 3",
    url: "https://scienceclassess.github.io/scienceisgreat22eliisnotallowed/"
  },

  { 
    name: "Website 4",
    url: "https://tristan-dez.github.io/mathgames/"
  }
];

function renderGameList() {
  const listContainer = document.getElementById("game-list");
  listContainer.innerHTML = '';

  gameList.forEach((game) => {
    const li = document.createElement('li');

    if (game.rainbow) {
      li.innerHTML = `<span class="rainbow-text">${game.name}</span>`;
    } else {
      li.textContent = game.name;
    }

    if (game.elite) {
      li.classList.add("elite-card");
    }

    li.onclick = () => {
      document.getElementById("game-iframe").src = game.url;
    };

    listContainer.appendChild(li);
  });
}

document.getElementById("fullscreen-btn").onclick = () => {
  document.getElementById("iframe-container").requestFullscreen();
};

renderGameList();
</script>

</body>
</html>
