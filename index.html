<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cash and Ridges Games</title>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0f0f1a, #1a1a2e);
  margin: 0;
  display: flex;
  justify-content: center;
  color: #fff;
}

.container {
  width: 90%;
  max-width: 1100px;
  text-align: center;
  padding: 30px;
}

h1 {
  font-size: 50px;
  text-transform: uppercase;
  background: linear-gradient(45deg, red, orange, yellow, green, cyan, blue, violet);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: glow 4s linear infinite;
}

@keyframes glow {
  0% { filter: hue-rotate(0deg); }
  100% { filter: hue-rotate(360deg); }
}

#game-list {
  list-style: none;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 20px;
  margin-top: 30px;
}

#game-list li {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  padding: 18px;
  border-radius: 15px;
  cursor: pointer;
  transition: all 0.25s ease;
  border: 1px solid rgba(255,255,255,0.1);
}

#game-list li:hover {
  transform: translateY(-5px) scale(1.05);
  background: linear-gradient(135deg, #ff6a00, #ff9a00);
  box-shadow: 0 0 20px rgba(255, 106, 0, 0.6);
}

.rainbow-text {
  background: linear-gradient(45deg, red, orange, yellow, green, blue, violet);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: rainbow 2s linear infinite;
}

@keyframes rainbow {
  0% { filter: hue-rotate(0deg); }
  100% { filter: hue-rotate(360deg); }
}

#iframe-container {
  width: 100%;
  height: 600px;
  margin-top: 30px;
  position: relative;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 0 25px rgba(0,0,0,0.6);
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
}

#fullscreen-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  background: linear-gradient(135deg, #ff6a00, #ff9a00);
  border: none;
  padding: 10px 14px;
  color: white;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.2s;
}

#fullscreen-btn:hover {
  transform: scale(1.1);
}
</style>
</head>

<body>

<div class="container">
  <h1>Cash and Ridges Games</h1>

  <ul id="game-list"></ul>

  <div id="iframe-container">
    <button id="fullscreen-btn">Fullscreen</button>
    <iframe id="game-iframe"></iframe>
  </div>
</div>

<script>
const gameList = [
  { name: "Lebron", url: "https://lebro.github.io/yeahno/" },
  { name: "Codys Shack Unblocked", url: "https://lebro.github.io/codys-shack-games/", rainbow: true },

  { name: "Cheesy Dih 🧀", url: "https://mathley.wasmer.app/", rainbow: true },
  { name: "Website 1", url: "https://scienceclassess.github.io/mathclassisnotgoodandsciencetooig/" },
  { name: "Website 2", url: "https://scienceclassess.github.io/scienceclassesstuah/" },
  { name: "Website 3", url: "https://scienceclassess.github.io/scienceisgreat22eliisnotallowed/" },
  { name: "Website 4", url: "https://tristan-dez.github.io/mathgames/" }
];

function renderGameList() {
  const listContainer = document.getElementById("game-list");
  listContainer.innerHTML = '';

  gameList.forEach((game) => {
    const li = document.createElement('li');

    if (game.rainbow) {
      li.innerHTML = `<span class="rainbow-text">${game.name}</span>`;
    } else {
      li.textContent = game.name;
    }

    li.onclick = () => {
      document.getElementById("game-iframe").src = game.url;
    };

    listContainer.appendChild(li);
  });
}

document.getElementById("fullscreen-btn").onclick = () => {
  document.getElementById("iframe-container").requestFullscreen();
};

renderGameList();
</script>

</body>
</html>
