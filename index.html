<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cash and Ridges Games</title>
  <style>
    /* Global Styles */
    body {
      font-family: 'Arial', sans-serif;
      background-color: #1a1a2e;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      color: #fff;
    }

    .container {
      width: 90%;
      max-width: 1000px;
      text-align: center;
      padding: 30px 20px;
    }

    /* Glowing Title */
    h1 {
      font-size: 48px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 10px #ff6a00, 0 0 20px #ff6a00, 0 0 30px #ff6a00;
      animation: glow 1.5s ease-in-out infinite alternate;
      margin-bottom: 40px;
    }

    @keyframes glow {
      0% {
        text-shadow: 0 0 10px #ff6a00, 0 0 20px #ff6a00, 0 0 30px #ff6a00;
      }
      100% {
        text-shadow: 0 0 25px #ff6a00, 0 0 40px #ff6a00, 0 0 50px #ff6a00;
      }
    }

    /* Game List Styles */
    #game-list {
      list-style: none;
      padding: 0;
      margin: 0 auto 30px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
    }

    #game-list li {
      background-color: #3a3a4b;
      color: white;
      padding: 15px;
      cursor: pointer;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 500;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    #game-list li:hover {
      background-color: #ff6a00;
      transform: scale(1.07);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
    }

    /* Iframe Container */
    #iframe-container {
      width: 100%;
      height: 550px;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 20px rgba(0,0,0,0.7);
      transition: all 0.3s ease;
    }

    #iframe-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      transition: all 0.3s ease;
    }

    /* Fullscreen Button */
    #fullscreen-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background-color: #ff6a00;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      z-index: 10;
      transition: background-color 0.3s ease;
      font-weight: bold;
    }

    #fullscreen-btn:hover {
      background-color: #ff8c00;
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
      h1 {
        font-size: 36px;
      }
      #game-list li {
        font-size: 16px;
      }
      #iframe-container {
        height: 400px;
      }
    }

  </style>
</head>
<body>

  <div class="container">
    <h1>Cash and Ridges Games</h1>

    <!-- Game List -->
    <ul id="game-list"></ul>

    <!-- Iframe Container -->
    <div id="iframe-container">
      <button id="fullscreen-btn">Go Fullscreen</button>
      <iframe id="game-iframe" src=""></iframe>
    </div>
  </div>

  <script>
    // Updated game list with BitLife and Hammy
    const gameList = [
      { name: 'Gn', url: 'https://social-lebron.github.io/gn-math.github.iotmoney/' },
      { name: 'Lebron', url: 'https://lebro293.github.io/goodnite/' },
      { name: "Cody's Shack", url: 'https://hammy-dotco.github.io/codys-shack-games/projects.html' },
      { name: 'BitLife', url: 'https://hammy-dotco.github.io/gamesite69/g/bitlife' },
      { name: 'Hammy', url: 'https://hammy-dotco.github.io/gamesite69/' } <!-- NEW GAME ADDED -->
    ];

    // Render game list
    function renderGameList() {
      const listContainer = document.getElementById("game-list");
      listContainer.innerHTML = '';
      gameList.forEach((game) => {
        const listItem = document.createElement('li');
        listItem.textContent = game.name;
        listItem.addEventListener('click', () => loadGame(game.url));
        listContainer.appendChild(listItem);
      });
    }

    // Load game into iframe
    function loadGame(url) {
      const iframe = document.getElementById("game-iframe");
      iframe.src = url;
    }

    // Fullscreen toggle
    function toggleFullscreen() {
      const iframeContainer = document.getElementById("iframe-container");
      if (iframeContainer.requestFullscreen) {
        iframeContainer.requestFullscreen();
      } else if (iframeContainer.mozRequestFullScreen) {
        iframeContainer.mozRequestFullScreen();
      } else if (iframeContainer.webkitRequestFullscreen) {
        iframeContainer.webkitRequestFullscreen();
      } else if (iframeContainer.msRequestFullscreen) {
        iframeContainer.msRequestFullscreen();
      }
    }

    document.getElementById("fullscreen-btn").addEventListener('click', toggleFullscreen);

    // Initial render
    renderGameList();
  </script>

</body>
</html>
