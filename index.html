<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unblocked Games</title>
  <style>
    /* Global Styles */
    body {
      font-family: 'Arial', sans-serif;
      background-color: #1a1a2e;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #fff;
      overflow-x: hidden;
    }
    
    .container {
      width: 90%;
      max-width: 900px;
      text-align: center;
      padding: 20px;
    }

    /* Glowing Title */
    h1 {
      font-size: 48px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 10px #ff6a00, 0 0 20px #ff6a00, 0 0 30px #ff6a00;
      animation: glow 1.5s ease-in-out infinite alternate;
    }

    @keyframes glow {
      0% {
        text-shadow: 0 0 10px #ff6a00, 0 0 20px #ff6a00, 0 0 30px #ff6a00;
      }
      100% {
        text-shadow: 0 0 25px #ff6a00, 0 0 40px #ff6a00, 0 0 50px #ff6a00;
      }
    }

    /* Game List Styles */
    #game-list {
      list-style-type: none;
      padding: 0;
      margin: 20px 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }
    #game-list li {
      background-color: #3a3a4b;
      color: white;
      padding: 15px;
      cursor: pointer;
      border-radius: 10px;
      font-size: 18px;
      transition: all 0.3s ease;
    }
    #game-list li:hover {
      background-color: #ff6a00;
      transform: scale(1.05);
    }

    /* Iframe Container */
    #iframe-container {
      width: 100%;
      height: 500px;
      border: 2px solid #333;
      background-color: #222;
      margin-top: 20px;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    /* Fullscreen Button */
    #fullscreen-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: #ff6a00;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      z-index: 10;
      transition: background-color 0.3s ease;
    }
    #fullscreen-btn:hover {
      background-color: #ff8c00;
    }

    /* Transition Effects */
    #iframe-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      transition: all 0.3s ease;
    }

  </style>
</head>
<body>

  <div class="container">
    <h1>Unblocked Games</h1>

    <!-- Game List -->
    <ul id="game-list">
      <!-- Predefined game items will be inserted here -->
    </ul>

    <!-- Iframe Container -->
    <div id="iframe-container">
      <button id="fullscreen-btn">Go Fullscreen</button>
      <iframe id="game-iframe" src="" frameborder="0"></iframe>
    </div>
  </div>

  <script>
    // Predefined list of game URLs
    const gameList = [
      { name: 'Gn', url: 'https://social-lebron.github.io/gn-math.github.iotmoney/' },
      { name: 'Lebron', url: 'https://lebro293.github.io/goodnite/' },
      { name: 'Codys Shack', url: 'https://hammy-dotco.github.io/codys-shack-games/projects.html' },
    ];

    // Function to render the game list
    function renderGameList() {
      const listContainer = document.getElementById("game-list");
      listContainer.innerHTML = '';
      gameList.forEach((game) => {
        const listItem = document.createElement('li');
        listItem.textContent = game.name;
        listItem.onclick = () => loadGame(game.url);
        listContainer.appendChild(listItem);
      });
    }

    // Function to load the game URL into the iframe
    function loadGame(url) {
      document.getElementById("game-iframe").src = url;
    }

    // Function to toggle fullscreen
    function toggleFullscreen() {
      const iframeContainer = document.getElementById("iframe-container");
      if (iframeContainer.requestFullscreen) {
        iframeContainer.requestFullscreen();
      } else if (iframeContainer.mozRequestFullScreen) { // Firefox
        iframeContainer.mozRequestFullScreen();
      } else if (iframeContainer.webkitRequestFullscreen) { // Chrome, Safari and Opera
        iframeContainer.webkitRequestFullscreen();
      } else if (iframeContainer.msRequestFullscreen) { // IE/Edge
        iframeContainer.msRequestFullscreen();
      }
    }

    // Set up fullscreen button
    document.getElementById("fullscreen-btn").onclick = toggleFullscreen;

    // Initial call to render the game list
    renderGameList();
  </script>

</body>
</html>
