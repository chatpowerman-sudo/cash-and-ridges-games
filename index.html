<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cash and Ridges Games</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1a1a2e;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #fff;
    }

    .container {
      width: 90%;
      max-width: 1000px;
      text-align: center;
      padding: 30px 20px;
    }

    h1 {
      font-size: 48px;
      text-transform: uppercase;
      background-image: linear-gradient(45deg, red, orange, yellow, green, blue, indigo, violet);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbowGlow 3s linear infinite;
    }

    @keyframes rainbowGlow {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    #game-list {
      list-style: none;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
    }

    #game-list li {
      background-color: #3a3a4b;
      padding: 15px;
      cursor: pointer;
      border-radius: 10px;
      transition: 0.3s;
    }

    #game-list li:hover {
      background-color: #ff6a00;
      transform: scale(1.05);
    }

    .rainbow-text {
      background-image: linear-gradient(45deg, red, orange, yellow, green, blue, indigo, violet);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbow 2s linear infinite;
    }

    @keyframes rainbow {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    #iframe-container {
      width: 100%;
      height: 550px;
      margin-top: 20px;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    #fullscreen-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #ff6a00;
      color: white;
      border: none;
      padding: 8px 12px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Cash and Ridges Games</h1>

    <ul id="game-list"></ul>

    <div id="iframe-container">
      <button id="fullscreen-btn">Fullscreen</button>
      <iframe id="game-iframe"></iframe>
    </div>
  </div>

  <script>
    const gameList = [
      { name: "Cody's Shack", url: 'https://hammy-dotco.github.io/codys-shack-games/projects.html' },
      { name: 'Cheesy Dih 🧀', url: 'https://mathley.wasmer.app/', rainbow: true },

      { name: 'Website 1', url: 'https://scienceclassess.github.io/mathclassisnotgoodandsciencetooig/' },
      { name: 'Website 2', url: 'https://scienceclassess.github.io/scienceclassesstuah/' },
      { name: 'Website 3', url: 'https://scienceclassess.github.io/scienceisgreat22eliisnotallowed/' },
      { name: 'Website 4', url: 'https://tristan-dez.github.io/mathgames/' }
    ];

    function renderGameList() {
      const listContainer = document.getElementById("game-list");
      listContainer.innerHTML = '';

      gameList.forEach((game) => {
        const li = document.createElement('li');

        if (game.rainbow) {
          li.innerHTML = `<span class="rainbow-text">${game.name}</span>`;
        } else {
          li.textContent = game.name;
        }

        li.onclick = () => {
          document.getElementById("game-iframe").src = game.url;
        };

        listContainer.appendChild(li);
      });
    }

    document.getElementById("fullscreen-btn").onclick = () => {
      document.getElementById("iframe-container").requestFullscreen();
    };

    renderGameList();
  </script>

</body>
</html>
